#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "donetick"
name = "Donetick"
description.en = "Managing tasks and chores"
description.fr = "Gestion des tâches et des corvées"

version = "0.1.86~ynh1"

maintainers = ["eric_G"]

[upstream]
license = "AGPL-3.0"
website = "https://donetick.com/"
demo = "https://app.donetick.com/login"
admindoc = "https://docs.donetick.com/getting-started/"
code = "https://github.com/donetick/donetick"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "100M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.admin]
    type = "user"
    help.en = "The username must include between 4 and 20 characters and only lowercase (a-z), figures (0-9), dots (.) or dashes (-)"
    help.fr = "Le nom d'utilisateur doit compter entre 4 et 20 caractères, uniquement des minuscules (a-z), des chiffres (0-9), points (.) ou des tirets (-)"

    [install.password]
    type = "password"
    help.en = "The password must include between 8 and 64 characters"
    help.fr = "Le mot de passe doit compter entre 8 et 64 caractères"

    [install.is_single_circle_instance]
    ask.en = "Single-circle mode"
    ask.fr = "Mode cercle unique"
    type = "boolean"
    help.en = "Next users created will be linked to the same circle than the admin user instead of having their own circle created by default. It can be helful typically for a small household-dedicated instance."
    help.fr = "Les prochains utilisateurs créés appartiendront au même cercle que le premier utilisateur admin au lieu de se voir créer leur propre cercle par défaut. Cela peut être utile typiquement pour une petite instance dédiée à un foyer."
    default = 0
    yes = "true"
    no = "false"

[resources]

    [resources.sources]

    [resources.sources.main]
    amd64.url = "https://github.com/donetick/donetick/releases/download/v0.1.86/donetick_Linux_x86_64.tar.gz"
    amd64.sha256 = "ef96027fbf2ad078ef7b8d7bacbf228d777265084ffd0f1b19f9941977fc9da8"
    arm64.url = "https://github.com/donetick/donetick/releases/download/v0.1.86/donetick_Linux_arm64.tar.gz"
    arm64.sha256 = "4ca35e958e94991c6d27231ff9e3dab822482169e90c88fc1b4c7b65e8e5afad"
    armhf.url = "https://github.com/donetick/donetick/releases/download/v0.1.86/donetick_Linux_armv7.tar.gz"
    armhf.sha256 = "50602010c42b34de03275ebf007beedf608f92d65b6b3117508701dffaf7eaaa"
    in_subdir = false

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = ".*_Linux_x86_64.tar.gz"
    autoupdate.asset.arm64 = ".*_Linux_arm64.tar.gz"
    autoupdate.asset.armhf = ".*_Linux_armv7.tar.gz"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"
    main.auth_header = false

    [resources.ports]
    main.default = 2021

    [resources.apt]
    packages = "postgresql"

    [resources.database]
    type = "postgresql"
